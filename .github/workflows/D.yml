name: Download Bomber Tools

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      # 1. دانلود Iran-Bomber (نسخه Go) از فورک فعال
      - name: Checkout Iran-Bomber (Fork)
        uses: actions/checkout@v4
        with:
          repository: esfelurm/iran-bomber
          path: iran-bomber
          ref: main

      # 2. دانلود SMS & Call Bomber 3.0
      - name: Checkout SMS-Bomber
        uses: actions/checkout@v4
        with:
          repository: Hossein774/SMS-Bomber
          path: SMS-Bomber
          ref: main

      # 3. دانلود smsbomber (PouyaFakham)
      - name: Checkout Sms-Bobmer
        uses: actions/checkout@v4
        with:
          repository: PouyaFakham/Sms-Bobmer
          path: Sms-Bobmer
          ref: main

      # 4. نمایش لیست فایل‌ها برای اطمینان
      - name: Verify Downloaded Folders
        run: |
          echo "--- Iran-Bomber ---"
          ls -la iran-bomber
          echo "--- SMS-Bomber ---"
          ls -la SMS-Bomber
          echo "--- Sms-Bobmer ---"
          ls -la Sms-Bobmer
